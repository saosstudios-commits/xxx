<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Set a new password — SeePay</title>
  <link rel="stylesheet" href="assets/css/seepay.css"><link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
</head>
<body data-page="auth">
  <main class="section section--tight"><div class="container" style="max-width:560px;padding-top:8vh">
    <div class="card">
      <span class="eyebrow">Account security</span><h1>Set a new password</h1>
      <p>Choose a new password for your SeePay account. Open this page from the password-reset email link.</p>
      <form id="update-password-form" class="form">
        <div class="field"><label for="new-password">New password</label><input class="input" id="new-password" type="password" autocomplete="new-password" minlength="8" required><span class="field__error" role="alert"></span></div>
        <div class="field"><label for="confirm-password">Confirm new password</label><input class="input" id="confirm-password" type="password" autocomplete="new-password" minlength="8" required><span class="field__error" role="alert"></span></div>
        <button class="btn btn--gold btn--block" type="submit">Update password</button>
      </form>
      <p class="small muted" style="margin-top:18px"><a href="forgot-password.html">Request another reset link</a> · <a href="login.html">Back to sign in</a></p>
    </div>
  </div></main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="assets/js/supabase-client.js"></script>
  <script src="assets/js/core.js"></script>
  <script src="assets/js/live-app.js"></script>
</body></html>
