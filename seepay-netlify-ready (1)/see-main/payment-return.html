<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Payment status — SeePay</title>
  <link rel="stylesheet" href="assets/css/seepay.css">
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
</head>
<body>
  <main class="section section--tight"><div class="container" style="max-width:720px;padding-top:8vh">
    <div class="card">
      <span class="eyebrow">Paystack checkout</span>
      <h1>Checking your payment</h1>
      <p>Returning from Paystack does not by itself prove a payment succeeded. SeePay marks the order paid only after the signed Paystack webhook verifies the transaction. You can check the current order status below.</p>
      <p id="payment-reference" class="small" style="overflow-wrap:anywhere"></p>
      <div class="flex wrap" style="gap:12px;margin-top:24px">
        <a id="status-link" class="btn btn--gold" href="order-status.html">Check order status</a>
        <a class="btn btn--outline" href="index.html">Home</a>
      </div>
    </div>
  </div></main>
  <script>
    const ref = new URLSearchParams(location.search).get('reference') || new URLSearchParams(location.search).get('trxref') || '';
    if (ref) {
      document.getElementById('payment-reference').textContent = 'Reference: ' + ref;
      document.getElementById('status-link').href = 'order-status.html?reference=' + encodeURIComponent(ref);
    }
  </script>
</body>
</html>
